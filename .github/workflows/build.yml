name: Build CityDrive3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CityDrive3D Android APK
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      # 1. Download the game project
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Check the build environment
      - name: Check Godot and Java
        shell: bash
        run: |
          set -eu
          godot --version
          java -version

      # 3. Configure Godot export templates
      - name: Prepare Godot Templates
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p build

          if [ -d /root/.config/godot ]; then
            mkdir -p "$HOME/.config/godot"
            cp -an /root/.config/godot/. \
              "$HOME/.config/godot/"
          fi

          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
            cp -an /root/.local/share/godot/export_templates/4.3.stable/. \
              "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          if [ ! -s "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "ERROR: Godot Android debug template is missing."
            exit 1
          fi

          if [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then
            echo "ERROR: Godot Android release template is missing."
            exit 1
          fi

          if [ ! -s "$TEMPLATE_DIR/android_source.zip" ]; then
            echo "ERROR: Godot Android source template is missing."
            exit 1
          fi

          echo "Godot export templates are ready."

      # 4. Configure Java and Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -eu

          SDK="/usr/lib/android-sdk"
          JAVA="/usr/lib/jvm/java-17-openjdk-amd64"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found: $SDK"
            exit 1
          fi

          if [ ! -d "$JAVA" ]; then
            echo "ERROR: Java directory not found: $JAVA"
            echo "Actual JAVA_HOME: ${JAVA_HOME:-not set}"
            exit 1
          fi

          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          mkdir -p "$HOME/.config/godot"

          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' \
              > "$SETTINGS"
          fi

          if ! grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            printf '\nexport/android/java_sdk_path = "%s"\n' "$JAVA" \
              >> "$SETTINGS"
          fi

          if ! grep -q 'export/android/android_sdk_path' "$SETTINGS"; then
            printf 'export/android/android_sdk_path = "%s"\n' "$SDK" \
              >> "$SETTINGS"
          fi

          echo "Java and Android SDK paths configured."

      # 5. Check the game files
      - name: Validate Project
        shell: bash
        run: |
          set -eu

          test -s project.godot
          test -s Main.tscn
          test -s Main.gd
          test -s export_presets.cfg

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo 'ERROR: Android preset was not found.'
            exit 1
          fi

          echo "Game project files are present."

      # 6. Import the project
      - name: Import Game Project
        shell: bash
        run: |
          set -eu

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --import \
            --quit

      # 7. Install the Android project template and export
      - name: Export Android APK
        shell: bash
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --verbose \
            --install-android-build-template \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/CityDrive3D.apk"

          if [ ! -s "$GITHUB_WORKSPACE/build/CityDrive3D.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully."
          ls -lh "$GITHUB_WORKSPACE/build/CityDrive3D.apk"

      # 8. Verify the APK
      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$GITHUB_WORKSPACE/build/CityDrive3D.apk"

          if ! unzip -t "$APK" >/dev/null; then
            echo "ERROR: APK verification failed."
            exit 1
          fi

          echo "APK file verification passed."

      # 9. Upload the finished game
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive3D-APK
          path: build/CityDrive3D.apk
          if-no-files
