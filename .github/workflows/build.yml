name: Build CityDrive3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  APK_NAME: CityDrive3D.apk

jobs:
  build:
    name: Build Android Game
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Godot and Java
        shell: bash
        run: |
          set -eu
          godot --version
          java -version
          echo "Godot and Java are available."

      - name: Configure Godot Templates and Settings
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p build

          if [ ! -d "/root/.config/godot" ]; then
            echo "ERROR: Godot settings are missing from the build image."
            exit 1
          fi

          if [ ! -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            echo "ERROR: Godot 4.3 export templates are missing."
            exit 1
          fi

          mkdir -p "$HOME/.config/godot"

          cp -a /root/.config/godot/. \
            "$HOME/.config/godot/"

          cp -a /root/.local/share/godot/export_templates/4.3.stable \
            "$HOME/.local/share/godot/export_templates/"

          echo "Checking Android templates..."

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/android_source.zip"

          echo "All three Android templates are available."

      - name: Configure Android Debug Signing
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/.android"

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            if [ -s "/root/debug.keystore" ]; then
              cp /root/debug.keystore "$HOME/.android/debug.keystore"
            else
              keytool -genkeypair \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"

          if [ ! -s "$SETTINGS" ]; then
            echo "ERROR: Godot editor settings were not found."
            exit 1
          fi

          echo "Debug signing configuration is prepared."

      - name: Validate Project Files
        shell: bash
        run: |
          set -eu

          test -s project.godot
          test -s Main.tscn
          test -s Main.gd
          test -s export_presets.cfg

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo 'ERROR: Android export preset was not found.'
            exit 1
          fi

          echo "Project files and Android preset are present."

      - name: Import Project
        shell: bash
        run: |
          set -eu

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --import \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/$APK_NAME"

          if [ ! -s "$GITHUB_WORKSPACE/build/$APK_NAME" ]; then
            echo "ERROR: APK export did not produce a file."
            exit 1
          fi

          echo "APK export completed."
          ls -lh "$GITHUB_WORKSPACE/build/$APK_NAME"

      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$GITHUB_WORKSPACE/build/$APK_NAME"

          if ! unzip -t "$APK" >/dev/null; then
            echo "ERROR: The generated APK is invalid."
            exit 1
          fi

          echo "APK verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive3D-APK
          path: build/CityDrive3D.apk
          if-no-files-found: error
          retention-days: 7
