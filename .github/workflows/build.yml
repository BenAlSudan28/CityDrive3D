name: Build CityDrive3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Download Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          mkdir templates
          unzip -q templates.tpz -d templates

          cp templates/templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          cp templates/templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          cp templates/templates/android_source.zip \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p build

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Create debug signing key
        run: |
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Build APK
        run: |
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/CityDrive3D.apk

          test -f build/CityDrive3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive3D-APK
          path: build/CityDrive3D.apk
          if-no-files-found: error
